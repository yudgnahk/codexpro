name: Apply Apps SDK file param fix

on:
  push:
    branches:
      - fix/apps-sdk-file-param
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apps-sdk-file-param
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch import_file descriptor and smoke coverage
        shell: python
        run: |
          from pathlib import Path
          import re

          server = Path('src/server.ts')
          source = server.read_text()
          pattern = re.compile(
              r'''file:\s*z\s*\.object\(\{\s*download_url:\s*z\.string\(\)\.describe\("Temporary HTTPS download URL provided by ChatGPT\."\),\s*file_id:\s*z\.string\(\)\.describe\("ChatGPT file id for this attachment\."\),\s*mime_type:\s*z\.string\(\)\.optional\(\)\.describe\("Optional MIME type declared by ChatGPT\."\),\s*file_name:\s*z\.string\(\)\.optional\(\)\.describe\("Optional original file name declared by ChatGPT\."\)\s*\}\)\s*\.describe\("ChatGPT Apps SDK file reference from openai/fileParams\."\),''',
              re.MULTILINE,
          )
          replacement = '''file: z.any().describe(
            "ChatGPT Apps SDK file reference supplied via openai/fileParams. The ChatGPT host hydrates this field to an object containing download_url and file_id before the tool call reaches CodexPro."
          ),'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'import_file schema replacement count={count}, expected 1')
          server.write_text(source)

          smoke = Path('scripts/import-smoke.mjs')
          source = smoke.read_text()
          start = source.find("      const fileParams = importTool._meta?.['openai/fileParams']")
          end_marker = "          }\n        }"
          if start < 0:
              raise SystemExit('import smoke descriptor start not found')
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('import smoke descriptor end not found')
          end += len(end_marker)
          replacement = '''      const listedMeta = importTool._meta || {};
      if (!Array.isArray(listedMeta['openai/fileParams']) || !listedMeta['openai/fileParams'].includes('file')) {
        throw new Error(`import_file missing openai/fileParams metadata: ${JSON.stringify(importTool)}`);
      }
      const fileSchema = importTool.inputSchema?.properties?.file;
      if (!fileSchema) {
        throw new Error(`import_file missing file schema: ${JSON.stringify(importTool)}`);
      }
      if (fileSchema.type === 'string') {
        throw new Error(`import_file file schema must not be string: ${JSON.stringify(fileSchema)}`);
      }'''
          smoke.write_text(source[:start] + replacement + source[end:])

      - run: npm ci
      - run: npm run build
      - run: node scripts/import-smoke.mjs

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-file-param-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts scripts/import-smoke.mjs .github/workflows/apply-file-param-fix.yml
          git commit -m "fix: allow Apps SDK file object hydration"
          git push origin HEAD:fix/apps-sdk-file-param
